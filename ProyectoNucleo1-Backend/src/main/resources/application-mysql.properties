# =========================================================================
# Perfil MySQL (entrega final / produccion)
# Activar con:  --spring.profiles.active=mysql
# Completar url/usuario/contrasena con los datos del servidor del curso.
# =========================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/nucleo1
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
