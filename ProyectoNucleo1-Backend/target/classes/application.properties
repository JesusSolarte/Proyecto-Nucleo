spring.application.name=ProyectoNucleo1 - Disponibilidad Docente

# =========================================================================
# Perfil por defecto: H2 en memoria (desarrollo / pruebas)
# Para usar MySQL activar el perfil "mysql":  --spring.profiles.active=mysql
# =========================================================================
spring.datasource.url=jdbc:h2:mem:nucleo1;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

jwt.secret=claveSecretaJwtProyectoNucleo1DisponibilidadDocente2026UnbosqueSegura

app.admin.nombre=Administrador
app.admin.apellido=Sistema
app.admin.correo=admin@proyectonucleo1.local
app.admin.nombre-usuario=admin
app.admin.contrasena=Admin12345
app.admin.telefono=3000000000

springdoc.swagger-ui.path=/
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=true

spring.jackson.default-property-inclusion=non_null
