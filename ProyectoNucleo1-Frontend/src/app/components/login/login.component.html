<section class="acceso">
  <div class="acceso-caja vidrio animate__animated animate__zoomIn">
    <span class="etiqueta">Disponibilidad Docente</span>
    <h2 class="acceso-titulo">Bienvenido de vuelta</h2>
    <p class="texto-suave mb-4">Inicia sesión para gestionar tus bloques horarios.</p>

    <div class="aviso aviso-error animate__animated animate__headShake" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label" for="usuario">Nombre de usuario</label>
        <input
          id="usuario"
          class="form-control"
          type="text"
          formControlName="nombreUsuario"
          placeholder="docente"
          autocomplete="username"
          [class.invalido]="form.get('nombreUsuario')?.invalid && form.get('nombreUsuario')?.touched">
        <span class="error-campo" *ngIf="form.get('nombreUsuario')?.invalid && form.get('nombreUsuario')?.touched">
          Ingresa tu nombre de usuario (mínimo 3 caracteres).
        </span>
      </div>

      <div class="mb-4">
        <label class="form-label" for="contrasena">Contraseña</label>
        <div class="d-flex gap-2">
          <input
            id="contrasena"
            class="form-control"
            [type]="mostrarContrasena ? 'text' : 'password'"
            formControlName="contrasena"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.invalido]="form.get('contrasena')?.invalid && form.get('contrasena')?.touched">
          <button type="button" class="btn btn-vidrio" (click)="toggleContrasena()">
            {{ mostrarContrasena ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <span class="error-campo" *ngIf="form.get('contrasena')?.invalid && form.get('contrasena')?.touched">
          Mínimo 8 caracteres.
        </span>
      </div>

      <button type="submit" class="btn btn-ambar w-100" [disabled]="form.invalid || cargando">
        <span class="spinner-border spinner-border-sm me-2" *ngIf="cargando"></span>
        {{ cargando ? 'Entrando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="acceso-pie">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </div>
</section>
