<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-brand">
      <span class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="3"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <circle cx="12" cy="15" r="3"></circle>
          <path d="M12 13.5V15l1 1"></path>
        </svg>
      </span>
      <span>Disponibilidad Docente</span>
    </div>

    <h2 class="auth-title">Bienvenido de vuelta</h2>
    <p class="auth-sub">Inicia sesión para gestionar tus bloques horarios</p>

    <div class="msg-box msg-error" *ngIf="error">
      <span>{{ error }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="usuario">Nombre de usuario</label>
        <input
          id="usuario"
          class="form-control"
          type="text"
          formControlName="nombreUsuario"
          placeholder="docente"
          autocomplete="username"
          [class.invalid]="form.get('nombreUsuario')?.invalid && form.get('nombreUsuario')?.touched">
        <span class="field-error" *ngIf="form.get('nombreUsuario')?.invalid && form.get('nombreUsuario')?.touched">
          Ingresa tu nombre de usuario (mínimo 3 caracteres).
        </span>
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <div class="password-wrapper">
          <input
            id="contrasena"
            class="form-control"
            [type]="mostrarContrasena ? 'text' : 'password'"
            formControlName="contrasena"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.invalid]="form.get('contrasena')?.invalid && form.get('contrasena')?.touched">
          <button type="button" class="password-toggle" (click)="toggleContrasena()"
                  [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!mostrarContrasena" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="mostrarContrasena" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="field-error" *ngIf="form.get('contrasena')?.invalid && form.get('contrasena')?.touched">
          Mínimo 8 caracteres.
        </span>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || cargando">
        <span class="spinner" *ngIf="cargando"></span>
        {{ cargando ? 'Entrando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </div>
</div>
