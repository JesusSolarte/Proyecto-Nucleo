<nav class="barra vidrio animate__animated animate__fadeInDown">
  <a class="marca" routerLink="/" (click)="cerrarMenu()">
    <span class="marca-icono">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="17" rx="3"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <circle cx="12" cy="15" r="3"></circle>
        <path d="M12 13.5V15l1 1"></path>
      </svg>
    </span>
    <span class="marca-texto">
      <span class="marca-nombre">Disponibilidad</span>
      <span class="marca-sub">Docente</span>
    </span>
  </a>

  <div class="d-none d-lg-flex gap-1">
    <a class="enlace" routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a class="enlace" routerLink="/consulta" routerLinkActive="activo">Consultar disponibilidad</a>
    <a class="enlace" routerLink="/dashboard" routerLinkActive="activo" *ngIf="auth.isLoggedIn()">Mis bloques</a>
  </div>

  <div class="d-flex align-items-center gap-2">
    <button class="tema btn-borde" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
      <svg *ngIf="!theme.isDark()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg *ngIf="theme.isDark()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>
        <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22" y2="12"></line>
        <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>
        <line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>
      </svg>
    </button>

    <div class="d-none d-lg-flex align-items-center gap-2">
      <ng-container *ngIf="!auth.isLoggedIn(); else sesionActiva">
        <a class="btn-borde" routerLink="/login">Acceder</a>
        <a class="btn-azul" routerLink="/register">Registrarse</a>
      </ng-container>
      <ng-template #sesionActiva>
        <span class="usuario etiqueta">
          <span class="punto"></span>
          {{ auth.getCurrentUser()?.nombre }} {{ auth.getCurrentUser()?.apellido }}
        </span>
        <button class="btn-peligro" type="button" (click)="logout()">Salir</button>
      </ng-template>
    </div>

    <button class="hamburguesa btn-borde d-lg-none" type="button" (click)="menuAbierto = !menuAbierto" aria-label="Menú">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>

<div class="menu-movil vidrio d-lg-none animate__animated animate__fadeIn" *ngIf="menuAbierto">
  <a class="enlace" routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }" (click)="cerrarMenu()">Inicio</a>
  <a class="enlace" routerLink="/consulta" routerLinkActive="activo" (click)="cerrarMenu()">Consultar disponibilidad</a>
  <a class="enlace" routerLink="/dashboard" routerLinkActive="activo" *ngIf="auth.isLoggedIn()" (click)="cerrarMenu()">Mis bloques</a>

  <ng-container *ngIf="!auth.isLoggedIn(); else movilSesion">
    <a class="btn-borde" routerLink="/login" (click)="cerrarMenu()">Acceder</a>
    <a class="btn-azul" routerLink="/register" (click)="cerrarMenu()">Registrarse</a>
  </ng-container>
  <ng-template #movilSesion>
    <span class="usuario texto-suave">{{ auth.getCurrentUser()?.nombre }} {{ auth.getCurrentUser()?.apellido }}</span>
    <button class="btn-peligro" type="button" (click)="logout(); cerrarMenu()">Cerrar sesión</button>
  </ng-template>
</div>
