<nav class="barra vidrio animate__animated animate__fadeInDown">
  <a class="marca" routerLink="/" (click)="cerrarMenu()">
    <span class="marca-icono">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="17" rx="3"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="16" y1="2" x2="16" y2="6"></line>
      </svg>
    </span>
    <span class="marca-texto">Disponibilidad<b>Docente</b></span>
  </a>

  <div class="enlaces d-none d-lg-flex">
    <a class="enlace" routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a class="enlace" routerLink="/consulta" routerLinkActive="activo">Consultar disponibilidad</a>
    <a class="enlace" routerLink="/dashboard" routerLinkActive="activo" *ngIf="auth.isLoggedIn()">Mis bloques</a>
  </div>

  <div class="d-none d-lg-flex align-items-center gap-2">
    <ng-container *ngIf="!auth.isLoggedIn(); else sesionActiva">
      <a class="btn btn-vidrio" routerLink="/login">Acceder</a>
      <a class="btn btn-ambar" routerLink="/register">Registrarse</a>
    </ng-container>
    <ng-template #sesionActiva>
      <span class="usuario">
        <span class="punto"></span>
        {{ auth.getCurrentUser()?.nombre }} {{ auth.getCurrentUser()?.apellido }}
      </span>
      <button class="btn btn-vidrio" type="button" (click)="logout()">Salir</button>
    </ng-template>
  </div>

  <button class="hamburguesa d-lg-none" type="button" (click)="menuAbierto = !menuAbierto" aria-label="Menú">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<div class="menu-movil vidrio d-lg-none animate__animated animate__fadeIn" *ngIf="menuAbierto">
  <a class="enlace" routerLink="/" (click)="cerrarMenu()">Inicio</a>
  <a class="enlace" routerLink="/consulta" (click)="cerrarMenu()">Consultar disponibilidad</a>
  <a class="enlace" routerLink="/dashboard" *ngIf="auth.isLoggedIn()" (click)="cerrarMenu()">Mis bloques</a>

  <ng-container *ngIf="!auth.isLoggedIn(); else movilSesion">
    <a class="btn btn-vidrio" routerLink="/login" (click)="cerrarMenu()">Acceder</a>
    <a class="btn btn-ambar" routerLink="/register" (click)="cerrarMenu()">Registrarse</a>
  </ng-container>
  <ng-template #movilSesion>
    <span class="usuario">{{ auth.getCurrentUser()?.nombre }} {{ auth.getCurrentUser()?.apellido }}</span>
    <button class="btn btn-vidrio" type="button" (click)="logout(); cerrarMenu()">Cerrar sesión</button>
  </ng-template>
</div>
